android.useAndroidX=true
# Retain compile/runtime dependency alignment while migrating to AGP 9.
android.dependency.useConstraints=true
# Preserve the unit-test variants included in the strict application dependency lock.
android.onlyEnableUnitTestForTheTestedBuildType=false
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2048m

# CipherBoard product identity. Keep branding and artifact metadata centralized.
cipherboard.applicationId=org.cipherboard.securekeyboard
cipherboard.productName=CipherBoard
cipherboard.versionCode=50200
cipherboard.versionName=0.5.2
cipherboard.artifactName=CipherBoard
cipherboard.buildToolsVersion=36.1.0
